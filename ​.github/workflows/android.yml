name: Build JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack jarvis.zip if present
        run: |
          if [ -f "jarvis.zip" ]; then
            mkdir -p unpacked_jarvis
            unzip -o jarvis.zip -d unpacked_jarvis
            find unpacked_jarvis -maxdepth 3 -ls
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare web app and Capacitor
        run: |
          mkdir -p www
          if [ -d "unpacked_jarvis/dist" ]; then
            cp -r unpacked_jarvis/dist/* www/
          elif [ -f "unpacked_jarvis/index.html" ]; then
            cp -r unpacked_jarvis/* www/
          elif [ -f "index.html" ]; then
            cp index.html www/
          else
            SUB_HTML=$(find unpacked_jarvis -name "index.html" | head -n 1)
            if [ -n "$SUB_HTML" ]; then
              cp -r "$(dirname "$SUB_HTML")"/* www/
            else
              echo "No index.html found"
              exit 1
            fi
          fi

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init JARVIS com.emmdrer.jarvis --web-dir=www
          npx cap add android
          npx cap copy android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
